name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refuses to publish a CV that still contains placeholders.
      - run: pnpm run check:content

      - run: pnpm exec playwright install --with-deps chromium

      # Builds the site and prints the PDF from it.
      - run: pnpm run build

      # Project name and output directory come from wrangler.toml.
      # --branch=main marks this a production deployment, which is what the
      # custom domain serves.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
